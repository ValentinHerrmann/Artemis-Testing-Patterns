plugins {
    id 'java'
    id 'maven-publish'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}
def baseVersion = '1.0.0'
def releaseTag = System.getenv('GITHUB_REF_TYPE') == 'tag' ? System.getenv('GITHUB_REF_NAME') : null
if (releaseTag) {
    version = releaseTag.startsWith('v') ? releaseTag.substring(1) : releaseTag
} else {
    def runNumber = System.getenv('GITHUB_RUN_NUMBER')
    version = runNumber ? "${baseVersion}.${runNumber}" : baseVersion
}
group = 'io.github.valentinherrmann'
compileJava.options.encoding = 'UTF-8'
compileTestJava.options.encoding = 'UTF-8'

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    testImplementation 'de.tum.in.ase:artemis-java-test-sandbox:1.15.0'
    implementation 'org.apache.commons:commons-lang3:3.18.0'

    // testImplementation(':E01V01---Implement-the-UML')
    // testImplementation(':E01V01---Implement-the-UML-Solution')
}

def assignmentSrcDir = "code_example_01/src"
def studentOutputDir = sourceSets.main.java.destinationDirectory.get()

sourceSets {
    test {
        java {
            srcDir 'test'
        }
        resources {
            srcDir 'test'
        }
    }


    main {
        java {
            srcDirs = [assignmentSrcDir]
        }
        resources {
            srcDirs = []
        }
    }
}

tasks.register('testJar', Jar) {
    archiveClassifier.set('')
    dependsOn tasks.named('testClasses')
    from sourceSets.test.output
}

tasks.named('jar') {
    enabled = false
}

def forbiddenPackageFolders = [ //(2)
                                "$studentOutputDir/ch/qos/logback/",
                                "$studentOutputDir/com/github/javaparser/",
                                "$studentOutputDir/com/intellij/",
                                "$studentOutputDir/com/sun/",
                                "$studentOutputDir/de/tum/cit/aet/test/",
                                "$studentOutputDir/de/tum/in/test/api/",
                                "$studentOutputDir/java/",
                                "$studentOutputDir/javax/",
                                "$studentOutputDir/jdk/",
                                "$studentOutputDir/net/bytebuddy/",
                                "$studentOutputDir/net/jqwik/",
                                "$studentOutputDir/org/assertj/",
                                "$studentOutputDir/org/apache/",
                                "$studentOutputDir/org/eclipse/",
                                "$studentOutputDir/org/gradle/",
                                "$studentOutputDir/org/jacoco/",
                                "$studentOutputDir/org/json/",
                                "$studentOutputDir/org/junit/",
                                "$studentOutputDir/org/opentest4j/",
                                "$studentOutputDir/sun/",
                                "$studentOutputDir/worker/org/gradle/"
]
test {
    doFirst { //(1)
        for (String packageFolder in forbiddenPackageFolders) {
            assert !file(packageFolder).exists(): "$packageFolder must not exist within the submission."
        }
    }
    defaultCharacterEncoding = 'UTF-8'
    testLogging.showStandardStreams = true
    useJUnitPlatform()
}


publishing {
    publications {
        maven(MavenPublication) {
            artifactId = 'levenshtein-testing-framework'
            artifact tasks.named('testJar')
        }
    }
        repositories {
                maven {
                        name = "GitHubPackages"
                        // Default to the repository running the workflow so GITHUB_TOKEN has package write access.
                        def packageRepository = System.getenv("GH_PACKAGES_REPOSITORY") ?: System.getenv("GITHUB_REPOSITORY") ?: "ValentinHerrmann/Levenshtein-Testing-Framework"
                        url = "https://maven.pkg.github.com/${packageRepository}"
                        credentials {
                                username = System.getenv("GH_PACKAGES_USER") ?: System.getenv("GITHUB_ACTOR")
                                password = System.getenv("GH_PACKAGES_TOKEN") ?: System.getenv("GITHUB_TOKEN")
                        }
                }
        }
}
